[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beurs"
version = "0.2.0"
description = "Market data that does not lie to you: audit, repair and screen any price series against the exchange that produced it. 54 venues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Punarbasu Pradhan" }]
keywords = ["market-data", "trading-calendar", "data-quality", "yfinance",
            "quantitative-finance", "equities", "survivorship-bias",
            "backtesting", "nse", "nyse", "nasdaq", "shanghai", "hkex",
            "tase", "tadawul", "bhavcopy", "india", "finance", "stocks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
fetch = ["curl_cffi>=0.7", "yfinance>=0.2"]
global = ["exchange_calendars>=4.5"]
all = ["curl_cffi>=0.7", "yfinance>=0.2", "exchange_calendars>=4.5"]
dev = ["pytest>=8.0", "curl_cffi>=0.7", "yfinance>=0.2",
       "exchange_calendars>=4.5", "pyarrow>=15.0"]

[project.scripts]
beurs = "beurs.cli:main"

[project.urls]
Homepage = "https://github.com/ShrewdLemon/beurs"
Traps = "https://github.com/ShrewdLemon/beurs/blob/main/TRAPS.md"
Issues = "https://github.com/ShrewdLemon/beurs/issues"
Security = "https://github.com/ShrewdLemon/beurs/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["beurs"]

# Without this the sdist ships metadata and nothing else -- no package, no
# tests -- and `pip install --no-binary` fails outright.
[tool.hatch.build.targets.sdist]
include = ["beurs", "tests", "README.md", "TRAPS.md", "SECURITY.md",
           "CONTRIBUTING.md", "DISCLAIMER.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build]
include = ["bhavkit/data/*.json"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4"]
# S112: repair_many and audit_many deliberately continue past a frame they
# cannot handle -- one unreadable name must not abort a 500-name run, and the
# reason is already reported in the result rather than a log.
ignore = ["B905", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
