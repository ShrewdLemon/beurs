name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The calendars this package ships are checked against live exchange data
    # weekly. A silent upstream change is exactly the failure mode bourse exists
    # to catch, so it should not be exempt from it.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q
