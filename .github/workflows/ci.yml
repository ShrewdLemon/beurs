name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The calendars this package ships are checked against live exchange data
    # weekly. A silent upstream change is exactly the failure mode beurs exists
    # to catch, so it should not be exempt from it.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q

  minimal-install:
    # beurs must import and audit with pandas alone. Every optional dependency
    # is optional, and a stray top-level import of yfinance or
    # exchange_calendars would break every user who installed the base package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: import and audit with no optional dependencies
        run: |
          python - <<'PY'
          import sys, pandas as pd, beurs
          for mod in ("yfinance", "exchange_calendars", "curl_cffi"):
              assert mod not in sys.modules, f"{mod} imported at package import"
          days = beurs.sessions("2024-02-01", "2024-04-30", exchange="NSE")
          idx = pd.DatetimeIndex([pd.Timestamp(d) for d in days])
          df = pd.DataFrame({"Open": 1.0, "High": 1.0, "Low": 1.0,
                             "Close": 1.0, "Volume": 1}, index=idx)
          assert beurs.audit(df, "X", exchange="NSE").clean
          assert beurs.repair(df, "X", exchange="NSE").log.n_changed == 0
          assert "NSE" in beurs.status()
          print("ok: audit, repair and the verified calendar work on pandas alone")
          PY
      - name: a sourced venue must fail with a useful message, not a traceback
        run: |
          python - <<'PY'
          import beurs
          try:
              beurs.sessions("2024-01-01", "2024-12-31", exchange="HKEX")
          except beurs.UnknownExchange as e:
              assert "beurs[global]" in str(e), e
              print("ok:", e)
          else:
              raise SystemExit("expected UnknownExchange without exchange_calendars")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check beurs/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install bandit pip-audit
      - run: bandit -r beurs/ -ll
      - run: pip-audit --skip-editable || true
